services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ./:/var/www
    ports:
      - "8000:8000"
    depends_on:
      - pgsql
      - redis
      - ssr
    environment:
      INERTIA_SSR_ENABLED: "true"
      INERTIA_SSR_URL: http://ssr:13714
      INERTIA_SSR_THROW_ON_ERROR: "true"
      PHP_CLI_SERVER_WORKERS: "4"
    command: ["php", "artisan", "serve", "--host=0.0.0.0", "--port=8000", "--no-reload"]

  queue:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ./:/var/www
    depends_on:
      - pgsql
      - redis
    command: ["php", "artisan", "queue:work", "--tries=3", "--backoff=10"]

  ssr:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ./:/var/www
    depends_on:
      - pgsql
      - redis
    command: ["php", "artisan", "inertia:start-ssr"]

  pgsql:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: digify
      POSTGRES_USER: digify
      POSTGRES_PASSWORD: secret
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  pgdata:
