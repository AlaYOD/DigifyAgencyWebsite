name: Frontend

on:
  push:
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run build:ssr
      - run: node tests/ssr-smoke.mjs
      - run: npx tsc --noEmit
      - run: npx eslint .
